<!doctype html>
<html lang="vi" data-bs-theme="dark" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/khung :: dau('Đăng nhập')}"></head>
<body>
<div th:replace="~{fragments/khung :: nen}"></div>
<header th:replace="~{fragments/khung :: thanh('')}"></header>
<main>
<div class="khung">
  <div class="cua-vao">
    <div class="o-khoi loi-chao">
      <div>
        <span class="so" style="color:var(--chu)">Thành viên Scarlet</span>
        <h1 class="td" style="margin-top:14px">Chào mừng<br>trở lại</h1>
        <p>Đăng nhập để chọn ghế, đặt vé và xem lại những vé bạn đã mua.</p>
      </div>
      <!-- Phiếu ưu đãi: mã đầu tiên đang dùng được trong bảng promotions -->
      <div class="phieu" th:if="${!#lists.isEmpty(uuDai)}" th:with="u=${uuDai[0]}">
        <div class="gia-tri" th:text="${u.label()}">10%</div>
        <div class="noi-dung"><span class="so" th:text="${'Mã ' + u.code()}">Mã SCARLET10</span><b th:text="${u.title()}">Giảm 10% mọi đơn</b><p>Nhập mã khi thanh toán</p></div>
      </div>
    </div>
    <form class="o-khoi mau-don" method="post" th:action="@{/dang-nhap}">
      <h2 class="td">Đăng nhập</h2>
      <p class="thong-bao" th:if="${loi != null}" th:text="${loi}">Email hoặc mật khẩu không đúng.</p>
      <p class="thong-bao nhe" th:if="${loi == null and tiep != ''}">Bạn cần đăng nhập để tiếp tục.</p>
      <!-- Địa chỉ đang muốn vào trước khi bị chuyển sang đây; đăng nhập xong sẽ quay lại đó -->
      <input type="hidden" name="tiep" th:value="${tiep}">
      <label class="truong"><span class="so">Email</span><input type="email" name="email" th:value="${email}" placeholder="ban@example.com" required autocomplete="username"></label>
      <label class="truong"><span class="so">Mật khẩu</span><input type="password" name="matKhau" placeholder="Mật khẩu của bạn" required autocomplete="current-password"></label>
      <button class="nut nut-do" type="submit">Đăng nhập</button>
      <p class="cuoi">Chưa có tài khoản? <a class="lien-ket" th:href="@{/dang-ky}" style="color:var(--chu)">Đăng ký</a></p>
    </form>
  </div>
</div>
</main>
<footer th:replace="~{fragments/khung :: chan}"></footer>
</body>
</html>
