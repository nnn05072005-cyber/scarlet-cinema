# ===== Scarlet Cinema - cấu hình ứng dụng =====
spring.application.name=scarlet-cinema

# Cổng chạy web: trên máy là 8080. Khi đưa lên máy chủ, cổng lấy từ biến môi trường PORT (file Dockerfile.vercel đặt là 80).
server.port=${PORT:8080}

# Kết nối MySQL. Mặc định là MySQL trên máy (XAMPP): cơ sở dữ liệu scarlet_cinema, tài khoản root, không mật khẩu.
# Khi đưa lên mạng, đặt ba biến môi trường DB_URL, DB_USER, DB_PASSWORD thay cho giá trị mặc định.
# createDatabaseIfNotExist=true: chưa có cơ sở dữ liệu scarlet_cinema thì MySQL tự tạo. Cơ sở dữ liệu chưa có bảng nào
# thì lúc khởi động web tự tạo 7 bảng và nạp dữ liệu mẫu (lớp DatabaseUpgrade), không cần tự chạy file SQL.
# Biến ADMIN_PASSWORD (không bắt buộc, từ 8 ký tự): đặt thì web dùng nó làm mật khẩu tài khoản quản trị.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/scarlet_cinema?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
# Mọi kết nối đều dùng giờ Việt Nam, để NOW() và CURDATE() trong SQL trả về đúng giờ của rạp
spring.datasource.hikari.connection-init-sql=SET time_zone = '+07:00'

# Phiên đăng nhập: giữ 60 phút, chỉ lưu mã phiên trong cookie.
# Nội dung phiên nằm trong MySQL (hai bảng SPRING_SESSION và SPRING_SESSION_ATTRIBUTES, Spring tự tạo nếu chưa có),
# không nằm trong bộ nhớ của máy chủ. Khi đưa lên mạng, máy chủ có thể tắt bật bất cứ lúc nào mà người dùng không bị đăng xuất.
spring.session.jdbc.initialize-schema=always
server.servlet.session.timeout=60m
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Khi chạy sau máy chủ trung gian (ví dụ Vercel), đọc địa chỉ và giao thức https thật từ các dòng tiêu đề X-Forwarded-*
server.forward-headers-strategy=framework

# Tiếng Việt
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
spring.thymeleaf.encoding=UTF-8

# Không lộ chi tiết lỗi ra trang web
server.error.include-stacktrace=never
server.error.include-message=never
